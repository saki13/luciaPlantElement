name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # 改这里就能升级 Godot；Godot 版本变化不会影响 Python 侧
  GODOT_VERSION: "4.7.2-stable"

jobs:
  python:
    name: python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet numpy pillow pygame

      - name: Unit tests
        run: |
          python -m unittest \
            tests.test_balance \
            tests.test_engine \
            tests.test_scenarios \
            tests.test_replay \
            tests.test_golden_sync \
            tests.test_session \
            tests.test_boss \
            tests.test_endless

      - name: Sprite health check
        # 注：源帧在 .gitignore 里（体积原因），所以这一步在 CI 只跑
        # 表结构 + 宽高比；多角色帧判据在本地跑 scripts/check_all.ps1 时才完整。
        run: python scripts/check_sprites.py

      - name: Calibration baseline
        run: python scripts/check_calibration.py

      - name: Level regression
        run: python scripts/check_levels.py

      - name: Render assertions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python scripts/check_render.py

  conformance:
    name: resolve_hit conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pillow

      - name: Install Godot runtime libs
        # 官方 Linux 编辑器二进制即使只跑 --version 也要动态链接这些库，
        # runner 上默认没有，缺了就会在 `./godot --version` 那步直接崩。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 \
            libgl1 libasound2 libpulse0

      - name: Download Godot
        run: |
          set -euo pipefail
          V=4.7.2-stable
          URL="https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          echo "URL=$URL"
          curl -fsSL --retry 3 --retry-delay 2 -o godot.zip "$URL"
          ls -l godot.zip
          unzip -o -q godot.zip
          ls -l
          # 不硬编码解压出来的文件名，避免 release 命名变化时抓瞎
          BIN="$(ls Godot_v*_linux.x86_64 | head -n1)"
          echo "BIN=$BIN"
          mv "$BIN" godot
          chmod +x godot

      - name: Godot version
        run: ./godot --version

      - name: Regenerate golden cases from the Python oracle
        run: python scripts/gen_golden_hits.py

      - name: Conformance gate
        run: ./godot --headless --path godot --script res://tests/run_conformance.gd
