<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>植物工坊 · Plant Forge</title>
<style>
:root{--bg:#15181f;--panel:#1e232e;--panel2:#252b38;--line:#333c4d;
  --fg:#e8ecf2;--dim:#8b97a8;--accent:#f5c85c;--ok:#6fd48a;--bad:#ef7a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
header{padding:12px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:600}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:2px 10px}
.tag.ok{color:var(--ok);border-color:#2f5c3d}
.tag.bad{color:var(--bad);border-color:#5c2f2f}
main{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;padding:12px 18px 30px}
@media(max-width:1150px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}
.card h2{font-size:12.5px;margin:0 0 9px;color:var(--accent);font-weight:600;letter-spacing:.04em}
label{display:block;font-size:11.5px;color:var(--dim);margin:7px 0 3px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;color:var(--fg);padding:6px 9px;font:inherit;font-size:13px}
textarea{resize:vertical;min-height:76px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08);color:#1a1a1a}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.hint{font-size:11px;color:var(--dim);margin-top:5px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cell{position:relative;aspect-ratio:1;background:var(--panel2);
  border:1px dashed var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.cell.filled{border-style:solid}
.cell.selected{outline:2px solid var(--accent);outline-offset:1px}
.cell.off{opacity:.3}
.cell canvas{width:100%;height:100%;image-rendering:pixelated}
.cell .lbl{position:absolute;left:4px;top:2px;font-size:9.5px;color:var(--dim);
  background:rgba(0,0,0,.5);padding:0 4px;border-radius:3px;pointer-events:none}
.cell .dot{position:absolute;right:5px;top:3px;font-size:9px;color:var(--accent);display:none}
.cell.saved .dot{display:block}
#frameEditor{border:1px solid var(--accent);border-radius:8px;padding:11px;
  margin:12px 0;background:#1b2130}
#frameEditor h3{margin:0 0 6px;font-size:12.5px;color:var(--accent)}
#preview{width:256px;height:256px;background:#fff;border-radius:6px;image-rendering:pixelated}
.wrap{display:flex;justify-content:center;margin-top:6px}
#log{font-size:11px;color:var(--dim);max-height:150px;overflow:auto;
  background:#12151b;border-radius:6px;padding:7px;margin-top:8px;white-space:pre-wrap}
.badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;
  background:#2d3546;color:var(--dim);margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>植物工坊</h1>
  <span class="tag" id="tokenTag">令牌检查中…</span>
  <span class="tag" id="unitTag">—</span>
</header>

<main>
  <!-- 左 -->
  <section class="card">
    <h2>① 选择角色</h2>
    <select id="unitSel"></select>
    <div class="row"><button id="reload">重新载入</button></div>
    <div class="hint" id="unitInfo"></div>

    <h2 style="margin-top:16px">② 整株描述</h2>
    <textarea id="base" placeholder="用大白话写这株植物长什么样：颜色、形状、有没有眼睛、拿什么武器……这一条会拼进每一帧的 prompt"></textarea>
    <div class="hint">改现有角色时会自动带出它的原始描述（没有就空着）。</div>

    <h2 style="margin-top:16px">③ 风格约束</h2>
    <textarea id="style">Q版圆润卡通，粗深色描边，明快平涂加少量渐变，一定要有一双又大又亮的卡通眼睛（黑色眼珠+白色高光），表情生动，正面平视，全身完整居中、站在画面底部中央，纯白色干净背景(#FFFFFF)，无地面投影，无文字水印，画面中只有这一个角色。</textarea>
  </section>

  <!-- 中 -->
  <section class="card">
    <h2>③ 动作帧 <span class="badge" id="frameBadge">0/11</span></h2>
    <div id="frameEditor">
      <h3 id="feTitle">选中一帧</h3>
      <div class="hint" id="feState">点下面任意一格来选中它。</div>
      <label>这一帧的 prompt</label>
      <textarea id="fePrompt" disabled></textarea>
      <div class="row">
        <button class="primary" id="feGen">生成这一帧</button>
        <button class="primary" id="feGenSave">生成并保存</button>
        <button id="feSave">只保存图片</button>
        <button id="feUndo">撤销</button>
      </div>
      <div class="row">
        <button id="fePrev">← 上一帧</button>
        <button id="feNext">下一帧 →</button>
        <button id="feUpload">上传替换</button>
        <button id="feClear">清空</button>
        <input type="file" id="feFile" accept="image/*" style="display:none">
      </div>
      <div class="hint">
        快捷键：<b>←/→</b> 切帧 · <b>Ctrl+Enter</b> 生成 · <b>Ctrl+S</b> 保存 ·
        prompt 改完自动落盘
      </div>
      <div class="hint" id="feHint"></div>
    </div>
    <div id="grid"></div>
    <div id="log">就绪</div>
  </section>

  <!-- 右 -->
  <section class="card">
    <h2>④ 合成预览</h2>
    <div class="wrap"><canvas id="preview" width="256" height="256"></canvas></div>
    <div class="row">
      <button class="primary" id="buildSheet" style="width:100%">拼表并写入 assets/sprites</button>
    </div>
    <div class="hint" id="sheetState"></div>
    <div class="hint" style="margin-top:10px">
      拼表用的是各个已保存/已生成的帧，直接覆盖
      <code>anim_demo/assets/sprites/&lt;key&gt;.png</code>。
      想回滚用 git checkout。
    </div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const FRAME = 64, COLS = 4;
let SLOTS = [], units = [], current = null, selected = -1;
const imgs = {};        // 当前帧图：slot -> {img: HTMLImageElement|HTMLCanvasElement, saved: bool}
const prompts = {};     // slot -> 用户改过的 prompt
let baseText = "";      // 整株描述
const undoStack = {};   // slot -> 上一张图（只留一层）
let saveTimer = null;

function log(m) {
  const el = $("log");
  el.textContent = (m + "\n" + el.textContent).slice(0, 6000);
}

/* ---------------- 载入 ---------------- */
async function boot() {
  let st;
  try { st = await (await fetch("/api/state")).json(); }
  catch (e) { log("连不上本地服务：" + e.message); return; }
  SLOTS = st.slots;
  $("tokenTag").textContent = st.token.configured
    ? "令牌已配置（" + st.token.from + "）" : "令牌未配置";
  $("tokenTag").className = "tag " + (st.token.configured ? "ok" : "bad");
  buildGrid();
  await loadUnits();
}

async function loadUnits() {
  const r = await (await fetch("/api/units")).json();
  units = r.units || [];
  const sel = $("unitSel");
  sel.innerHTML = "";
  for (const u of units) {
    const o = document.createElement("option");
    o.value = u.key;
    o.textContent = `${u.cn}  ·  ${u.key}`;
    sel.appendChild(o);
  }
  $("unitTag").textContent = `共 ${units.length} 个角色`;
  if (units.length) selectUnit(units[0].key);
}

async function selectUnit(key) {
  current = units.find(u => u.key === key) || null;
  selected = -1;
  for (const k of Object.keys(imgs)) delete imgs[k];
  for (const k of Object.keys(prompts)) delete prompts[k];
  if (!current) return;
  $("unitInfo").textContent = `${current.cn} · ${current.key} · ${current.kind}`;

  // 1) 先试项目里的帧
  const fr = await (await fetch("/api/frames?key=" + encodeURIComponent(key))).json();
  Object.assign(prompts, fr.prompts || {});
  baseText = fr.base || "";
  $("base").value = baseText;
  let anySaved = false;
  for (const s of SLOTS) {
    if (!s.enabled) continue;
    const b64 = fr.frames && fr.frames[s.name];
    if (b64) {
      imgs[s.name] = { src: "data:image/png;base64," + b64, saved: true };
      anySaved = true;
    }
  }
  if (!anySaved) {
    // 2) 没有项目帧就切精灵表
    await fillFromSheet(key);
  }
  renderGrid();
  renderEditor();
  drawPreview();
  log(`${current.cn} 载入完成（${anySaved ? "项目帧" : "精灵表"}）`);
}

function fillFromSheet(key) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      for (const s of SLOTS) {
        if (!s.enabled) continue;
        const c = document.createElement("canvas");
        c.width = FRAME; c.height = FRAME;
        c.getContext("2d").drawImage(im, s.col * FRAME, s.row * FRAME,
          FRAME, FRAME, 0, 0, FRAME, FRAME);
        imgs[s.name] = { src: c.toDataURL("image/png"), saved: false };
      }
      resolve();
    };
    im.onerror = () => { log("精灵表载入失败"); resolve(); };
    im.src = "/api/sheet?key=" + encodeURIComponent(key) + "&t=" + Date.now();
  });
}

/* ---------------- 网格 ---------------- */
function buildGrid() {
  const g = $("grid");
  g.innerHTML = "";
  SLOTS.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "cell" + (s.enabled ? "" : " off");
    d.dataset.slot = s.name;
    d.innerHTML = `<span class="lbl">${s.name}</span><span class="dot">●</span>`;
    d.addEventListener("click", () => { selected = i; renderGrid(); renderEditor(); });
    g.appendChild(d);
  });
}

function renderGrid() {
  let n = 0;
  document.querySelectorAll("#grid .cell").forEach((d, i) => {
    const s = SLOTS[i];
    const rec = imgs[s.name];
    d.classList.toggle("selected", i === selected);
    d.classList.toggle("filled", !!rec);
    d.classList.toggle("saved", !!(rec && rec.saved));
    d.querySelectorAll("canvas").forEach(x => x.remove());
    if (rec) {
      const c = document.createElement("canvas");
      c.width = FRAME; c.height = FRAME;
      const ctx = c.getContext("2d");
      const im = new Image();
      im.onload = () => {
        const W = FRAME - 6, H = FRAME - 8;
        const k = Math.min(W / im.width, H / im.height);
        const w = Math.max(1, Math.round(im.width * k));
        const h = Math.max(1, Math.round(im.height * k));
        ctx.drawImage(im, Math.round((FRAME - w) / 2), FRAME - 4 - h, w, h);
      };
      im.src = rec.src;
      d.appendChild(c);
      if (s.enabled) n++;
    }
  });
  $("frameBadge").textContent = `${n}/11`;
  drawPreview();
}

/* ---------------- 编辑区 ---------------- */
function defaultPrompt(slot) {
  const desc = baseText.trim() ? baseText.trim() + "。" : "";
  const hint = {
    idle: "平静待机，身体端正放松，眼睛自然睁开",
    walk: "茎叶被微风轻摇的循环姿态（植物不移动）",
    attack: "正在出手：身体前倾，炮口/嘴部张开，有蓄力或后坐的张力",
    hurt: "受击：身体后仰，眼睛眯起或闭成弧线，表情痛苦",
  }[slot.name.replace(/_\d+$/, "")] || "";
  return `${desc}当前这一帧是「${slot.name}」：${hint}。` +
    `保持同一株植物的颜色、描边、器官结构完全不变，只改姿态与表情。` +
    `，${$("style").value.trim()}`;
}

function renderEditor() {
  if (selected < 0) {
    $("feTitle").textContent = "选中一帧";
    $("feState").textContent = "点下面任意一格来选中它。";
    $("fePrompt").value = ""; $("fePrompt").disabled = true;
    $("feHint").textContent = "";
    return;
  }
  const s = SLOTS[selected];
  const rec = imgs[s.name];
  $("feTitle").textContent = "正在编辑：" + s.name + (s.enabled ? "" : "（这一格用不到）");
  $("feState").textContent = (rec ? "当前已有图" : "当前为空") +
    (rec && rec.saved ? " · 已存到磁盘" : " · 还没保存到磁盘");
  $("fePrompt").disabled = false;
  $("fePrompt").value = prompts[s.name] || defaultPrompt(s);
  const custom = Object.prototype.hasOwnProperty.call(prompts, s.name);
  $("feHint").textContent = (rec
    ? "生成时会用这一帧当参考图（图生图），保持还是同一株植物。"
    : "这一帧还没有图，生成会用纯文生图。") +
    (custom ? "  · 这一帧的 prompt 是自定义的" : "");
}

/* ---------------- prompt 落盘 ---------------- */
function scheduleSaveProject() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProjectNow, 700);
}
async function saveProjectNow() {
  if (!current) return;
  try {
    const r = await fetch("/api/project", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: current.key, base: baseText,
                             frames: prompts }),
    });
    const js = await r.json();
    if (!js.ok) throw new Error(js.error || "保存失败");
  } catch (e) { log("prompt 保存失败：" + e.message); }
}

/* ---------------- 生成 / 保存 ---------------- */
async function generateFrame(autoSave) {
  if (selected < 0) { log("先选一帧"); return; }
  const s = SLOTS[selected];
  const prompt = ($("fePrompt").value || "").trim();
  if (!prompt) { log("prompt 为空"); return; }
  prompts[s.name] = prompt;

  const btn = $("feGen");
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "生成中…";
  log(`开始生成 ${s.name}（可能要 1~3 分钟）…`);
  const t0 = Date.now();
  try {
    const body = { prompt };
    const rec = imgs[s.name];
    if (rec) body.ref = rec.src;
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const js = await r.json();
    if (!js.ok) throw new Error(js.error || "生成失败");
    if (rec) undoStack[s.name] = rec;
    imgs[s.name] = { src: js.image, saved: false };
    renderGrid(); renderEditor();
    log(`${s.name} 生成完成（${js.seconds}s）。` + (autoSave ? "已保存。" : "记得点「保存到磁盘」。"));
    if (autoSave) await saveFrame();
  } catch (e) {
    log("生成失败：" + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function saveFrame() {
  if (selected < 0) return;
  const s = SLOTS[selected];
  const rec = imgs[s.name];
  if (!rec) { log("这一帧还没有图"); return; }
  try {
    const r = await fetch("/api/frame", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: current.key, slot: s.name, image: rec.src,
                             prompt: prompts[s.name] || "" }),
    });
    const js = await r.json();
    if (!js.ok) throw new Error(js.error);
    rec.saved = true;
    renderGrid(); renderEditor();
    log(`${s.name} 已保存到 anim_demo/assets/plants/${current.key}/frames/`);
  } catch (e) { log("保存失败：" + e.message); }
}

/* ---------------- 拼表 ---------------- */
function drawPreview() {
  const cv = $("preview"), ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 256, 256);
  const jobs = [];
  for (const s of SLOTS) {
    const rec = imgs[s.name];
    if (!rec) continue;
    jobs.push(new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const W = FRAME - 6, H = FRAME - 8;
        const k = Math.min(W / im.width, H / im.height);
        const w = Math.max(1, Math.round(im.width * k));
        const h = Math.max(1, Math.round(im.height * k));
        ctx.drawImage(im, s.col * FRAME + Math.round((FRAME - w) / 2),
          s.row * FRAME + (FRAME - 4 - h), w, h);
        res();
      };
      im.onerror = res;
      im.src = rec.src;
    }));
  }
  Promise.all(jobs).then(() => {
    ctx.strokeStyle = "rgba(0,0,0,.16)";
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * FRAME + .5, 0); ctx.lineTo(c * FRAME + .5, 256); ctx.stroke();
    }
    for (let r = 0; r <= 4; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * FRAME + .5); ctx.lineTo(256, r * FRAME + .5); ctx.stroke();
    }
  });
}

async function buildSheet() {
  if (!current) return;
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 256;
  const ctx = cv.getContext("2d");
  await Promise.all(SLOTS.map(s => new Promise(res => {
    const rec = imgs[s.name];
    if (!rec) return res();
    const im = new Image();
    im.onload = () => {
      const W = FRAME - 6, H = FRAME - 8;
      const k = Math.min(W / im.width, H / im.height);
      const w = Math.max(1, Math.round(im.width * k));
      const h = Math.max(1, Math.round(im.height * k));
      ctx.drawImage(im, s.col * FRAME + Math.round((FRAME - w) / 2),
        s.row * FRAME + (FRAME - 4 - h), w, h);
      res();
    };
    im.onerror = res;
    im.src = rec.src;
  })));
  try {
    const r = await fetch("/api/sheet", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: current.key, image: cv.toDataURL("image/png") }),
    });
    const js = await r.json();
    if (!js.ok) throw new Error(js.error);
    $("sheetState").textContent = "已写入 " + js.path;
    log("拼表完成 → " + js.path);
  } catch (e) { log("拼表失败：" + e.message); }
}

/* ---------------- 绑定 ---------------- */
$("unitSel").addEventListener("change", e => selectUnit(e.target.value));
$("reload").onclick = () => selectUnit(current ? current.key : (units[0] && units[0].key));
$("feGen").onclick = () => generateFrame(false);
$("feGenSave").onclick = () => generateFrame(true);
$("feSave").onclick = saveFrame;
$("feClear").onclick = () => {
  if (selected < 0) return;
  const n = SLOTS[selected].name;
  if (imgs[n]) undoStack[n] = imgs[n];
  delete imgs[n];
  renderGrid(); renderEditor();
};
$("feUndo").onclick = () => {
  if (selected < 0) return;
  const n = SLOTS[selected].name;
  if (!undoStack[n]) { log("这一帧没有可撤销的操作"); return; }
  imgs[n] = undoStack[n];
  delete undoStack[n];
  renderGrid(); renderEditor();
  log("已撤销 " + n + "（记得保存）");
};
$("fePrev").onclick = () => moveSelection(-1);
$("feNext").onclick = () => moveSelection(1);

$("base").addEventListener("input", () => {
  baseText = $("base").value;
  scheduleSaveProject();
  if (selected >= 0 && !Object.prototype.hasOwnProperty.call(prompts, SLOTS[selected].name)) {
    renderEditor();          // 没自定义的帧，默认 prompt 跟着变
  }
});

document.addEventListener("keydown", e => {
  const inText = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""));
  if (e.key === "ArrowLeft" && !inText) { moveSelection(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight" && !inText) { moveSelection(1); e.preventDefault(); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { generateFrame(false); e.preventDefault(); }
  else if ((e.key === "s" || e.key === "S") && (e.ctrlKey || e.metaKey)) { saveFrame(); e.preventDefault(); }
});

function moveSelection(d) {
  const order = SLOTS.map((s, i) => s.enabled ? i : -1).filter(i => i >= 0);
  if (!order.length) return;
  const at = order.indexOf(selected);
  const next = at < 0 ? order[0] : order[(at + d + order.length) % order.length];
  selected = next;
  renderGrid(); renderEditor();
  const el = document.querySelectorAll("#grid .cell")[selected];
  if (el) el.scrollIntoView({ block: "nearest" });
}
$("feUpload").onclick = () => $("feFile").click();
$("feFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f || selected < 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    imgs[SLOTS[selected].name] = { src: fr.result, saved: false };
    renderGrid(); renderEditor();
    log("已替换（记得保存到磁盘）");
  };
  fr.readAsDataURL(f);
  e.target.value = "";
};
$("fePrompt").addEventListener("input", () => {
  if (selected < 0) return;
  prompts[SLOTS[selected].name] = $("fePrompt").value;
  scheduleSaveProject();
});
$("buildSheet").onclick = buildSheet;

boot();
</script>
</body>
</html>
